<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNIVERSE - Login</title>

  <link rel="shortcut icon" href="/img/favicon.svg" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/cadastro.css">
</head>

<body>
  <header>
    <img src="/img/logo-pequena.svg" alt="universe logo">
  </header>

  <main>
    <h3>Cadaste-se e faça parte do universe</h3>
    <form class="formulario-cadastro">
      <label for="senha">Nome</label>
      <input type="text" id="nome" name="nome" placeholder="Seu nome" required>

      <label for="senha">E-mail</label>
      <input type="text" id="email" name="email" placeholder="email@dominio.com" required>

      <label for="senha">Usuário</label>
      <input type="text" id="usuario" name="usuario" placeholder="nickname123" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="********" required>

      <label for="senha">Confirme sua senha</label>
      <input type="password" id="senha" name="senha" placeholder="********" required>
    </form>

    <div class="botoes">
      <a href="/login.html" class="botao voltar">
        <img src="/img/seta-roxa.svg" alt="">
        Voltar ao login</a>
      <a href="/feed.html" class="botao cadastrar">Cadastrar</a>
    </div>
  </main>

  <footer>
    <span>Desenvolvido por Bev Feitosa - 2025</span>
  </footer>
</body>

</html>
