<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNIVERSE - Login</title>

  <link rel="shortcut icon" href="/img/favicon.svg" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/login.css">
</head>

<body>
  <header>
    <img src="/img/logo-grande.svg" alt="universe logo">
    <h2>A rede social de astronomia</h2>
  </header>

  <main>
    <h3>Boas vindas, astronauta!</h3>
    <form class="formulario-login">
      <label for="senha">Usuário</label>
      <input type="text" id="usuario" name="usuario" placeholder="nickname123" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="********" required>
    </form>

    <a href="#" class="recuperar-senha">Esqueci minha senha</a>

    <a href="/feed.html" class="botao entrar">Entrar</a>
    <a href="/cadastro.html" class="botao cadastrar">Cadastrar-se</a>
  </main>

  <footer>
    <span>Desenvolvido por Bev Feitosa - 2025</span>
  </footer>
</body>

</html>
